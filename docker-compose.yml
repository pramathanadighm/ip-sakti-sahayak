version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: ipsakti-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  postgres:
    image: postgres:16-alpine
    container_name: ipsakti-postgres
    restart: always
    environment:
      POSTGRES_USER: ipsakti_user
      POSTGRES_PASSWORD: ipsakti_password
      POSTGRES_DB: ipsakti_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_storage:
  postgres_data:
